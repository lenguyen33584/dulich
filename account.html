<script>
let user = localStorage.getItem("currentUser");

if(!user){
  alert("Bạn chưa đăng nhập!");
  location.href="index.html";
}

// ===== DATA =====
function getData(){
  return JSON.parse(localStorage.getItem("data_"+user)||"{}");
}
function saveData(d){
  localStorage.setItem("data_"+user, JSON.stringify(d));
}

// ===== NAV =====
function goHome(){
  location.href="index.html";
}

function logout(){
  if(confirm("Bạn chắc chắn đăng xuất?")){
    localStorage.removeItem("currentUser");
    location.href="index.html";
  }
}

// ===== ACTIVE TAB =====
function setActive(tab){
  document.querySelectorAll(".menu-item").forEach(el=>{
    el.classList.remove("active");
    if(el.dataset.tab===tab) el.classList.add("active");
  });
}

// ===== RENDER =====
function render(tab){
  let box = document.getElementById("contentBox");
  let data = getData();
  setActive(tab);

  // ===== PROFILE =====
  if(tab==="profile"){
    box.innerHTML = `
    <div class="card">
      <h2>👤 Hồ sơ</h2>
      <h3>💰 Số dư: ${(data.balance||0).toLocaleString()}đ</h3>

      <div class="form-grid">
        <input id="fullname" placeholder="Họ tên">
        <input id="phone" placeholder="SĐT">
        <input id="email" placeholder="Email">
        <input id="bank" placeholder="Số tài khoản">
        <input id="bankName" placeholder="Ngân hàng">
      </div>

      <br>
      <button class="btn" onclick="saveProfile()">Lưu</button>
    </div>
    `;

    let p = data.profile || {};

    fullname.value = p.fullname || "";
    phone.value = p.phone || "";
    email.value = p.email || "";
    bank.value = p.bank || "";
    bankName.value = p.bankName || "";
  }

  // ===== HISTORY =====
  if(tab==="history"){
    let bets = (data.bets || []).sort((a,b)=>b.time - a.time);

    let html = bets.map(b=>{
      let text = b.status==="win" ? "🏆 Thắng"
               : b.status==="lose" ? "❌ Thua"
               : "⏳ Đang chờ";

      return `
      <div class="row">
        <span>🎯 ${b.so} (${b.loai})</span>
        <span>${b.tien.toLocaleString()}đ</span>
        <span class="status ${b.status||'pending'}">${text}</span>
      </div>
      `;
    }).join("");

    box.innerHTML = `
      <div class="card">
        <h2>📜 Lịch sử</h2>
        ${html || "Chưa có dữ liệu"}
      </div>
    `;
  }

  // ===== SETTINGS =====
  if(tab==="settings"){
    box.innerHTML = `
      <div class="card">
        <h2>⚙️ Đổi mật khẩu</h2>

        <input id="oldPass" type="password" placeholder="Mật khẩu cũ">
        <input id="newPass" type="password" placeholder="Mật khẩu mới">

        <button class="btn" onclick="changePass()">Đổi mật khẩu</button>
      </div>
    `;
  }
}

// ===== SAVE PROFILE =====
function saveProfile(){
  let data = getData();

  if(phone.value && !/^\d{9,11}$/.test(phone.value)){
    return alert("SĐT không hợp lệ");
  }

  if(email.value && !/^\S+@\S+\.\S+$/.test(email.value)){
    return alert("Email không hợp lệ");
  }

  data.profile = {
    fullname: fullname.value,
    phone: phone.value,
    email: email.value,
    bank: bank.value,
    bankName: bankName.value
  };

  saveData(data);
  alert("Đã lưu!");
}

// ===== CHANGE PASS =====
function changePass(){
  let oldP = oldPass.value;
  let newP = newPass.value;

  let users = JSON.parse(localStorage.getItem("users")||"{}");

  if(!users[user] || users[user].password !== oldP){
    return alert("Sai mật khẩu");
  }

  if(newP.length < 6){
    return alert("Mật khẩu ≥ 6 ký tự");
  }

  users[user].password = newP;
  localStorage.setItem("users", JSON.stringify(users));

  alert("Đổi mật khẩu thành công");
}

// ===== MENU =====
document.querySelectorAll(".menu-item").forEach(el=>{
  if(el.dataset.tab){
    el.onclick = ()=> render(el.dataset.tab);
  }
});

// ===== LOAD TAB FROM URL =====
let urlParams = new URLSearchParams(window.location.search);
let tab = urlParams.get("tab") || "profile";

render(tab);
</script>
